# Dependabot — version updates, one grouped pull request a week per ecosystem (v20).
# Dependabot *alerts* and *security updates* are enabled on the repository (organization-managed) and need no file;
# this adds the routine bumps: the pinned Python requirements, the pinned actions of the CI workflow, the base image.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7  # a new version must be a week old before it is proposed (supply-chain hygiene; zizmor's dependabot-cooldown)
    groups:
      python-requirements:
        patterns: ["*"]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7  # a new version must be a week old before it is proposed (supply-chain hygiene; zizmor's dependabot-cooldown)
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7  # a new version must be a week old before it is proposed (supply-chain hygiene; zizmor's dependabot-cooldown)
    commit-message:
      prefix: "build(deps)"
